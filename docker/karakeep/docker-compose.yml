  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    restart: unless-stopped
    container_name: karakeep-chrome
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    networks:
      - proxy

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    container_name: karakeep-meilisearch
    networks:
      - proxy
    env_file:
      - "${BAK_CFG_DIR}/karakeep/.env"
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data

  karakeep-sync:
    image: ghcr.io/sidoshi/karakeep-sync:latest
    container_name: karakeep-sync
    restart: unless-stopped
    networks:
      - proxy
    env_file:
      - "${BAK_CFG_DIR}/karakeep/karakeep-sync.env"

  ollama:
    image: ollama/ollama:latest
    container_name: karakeep-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  meilisearch:
  ollama:
