services:
  mcphub:
    image: samanhappy/mcphub:latest
    restart: unless-stopped
    env_file:
      - ${BAK_CFG_DIR}/mcphub/.env
      - ${BAK_CFG_DIR}/mcphub/netbird.env
      - path: ${MCPHUB_STATE_DIR:?run deploy.sh}/omniroute.env
        required: false
    environment:
      NETBIRD_MCP_URL: "http://netbird-mcp-backend/api/mcp"
      MCPHUB_SETTING_PATH: /app/state/mcp_settings.json
    volumes:
      - ${MCPHUB_STATE_DIR:?run deploy.sh}:/app/state
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.services.mcphub.loadbalancer.server.port: "3000"
      traefik.http.routers.mcphub.rule: Host(`${MCPHUB_HOST:-mcphub.${CF_DOMAIN:?set CF_DOMAIN}}`)
      traefik.http.routers.mcphub.entrypoints: https
      traefik.http.routers.mcphub.tls: "true"
      traefik.http.routers.mcphub.middlewares: oauth@file
      traefik.http.routers.mcphub-agents.rule: Host(`${MCPHUB_HOST:-mcphub.${CF_DOMAIN:?set CF_DOMAIN}}`) && (Path(`/mcp`) || PathPrefix(`/mcp/`))
      traefik.http.routers.mcphub-agents.entrypoints: https
      traefik.http.routers.mcphub-agents.tls: "true"
      traefik.http.routers.mcphub-agents.priority: "100"
  terraform-mcp:
    image: hashicorp/terraform-mcp-server:latest
    restart: unless-stopped
    environment:
      TRANSPORT_MODE: streamable-http
      TRANSPORT_HOST: 0.0.0.0
      TRANSPORT_PORT: "8080"
      MCP_CORS_MODE: disabled
    networks: [proxy]
    labels:
      traefik.enable: "false"
networks:
  proxy:
    external: true
